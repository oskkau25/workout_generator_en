name: Quality Gates CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "new-app/package-lock.json"

      - name: Install new-app dependencies
        working-directory: new-app
        run: npm ci

      - name: Lint new-app
        working-directory: new-app
        run: npm run lint

      - name: Type-check new-app
        working-directory: new-app
        run: npx tsc --noEmit

      - name: Test new-app
        working-directory: new-app
        run: npx vitest run

      - name: Build new-app
        working-directory: new-app
        run: npm run build

      - name: Upload Vitest coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-app-coverage
          path: |
            new-app/coverage
